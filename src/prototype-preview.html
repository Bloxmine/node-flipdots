<!DOCTYPE html>
<html>
<head>
  <title>FlipDot Prototype Display</title>
  <style>
    :root {
        --color-white: #fff;
        --color-black: #000;
        --color-dark-bg: #0a0a0a;
        --color-darker-bg: #111;
        --color-medium-bg: #222;
        --color-border-dark: #333;
        --color-border-medium: #444;
        --color-border-light: #666;
        --color-border-lighter: #888;
        --color-text-light: #ccc;
        --color-button-bg: #444;
        --color-button-hover: #666;
        --color-restart-bg: #633;
        --color-restart-border: #855;
        --color-restart-hover: #855;
        --color-restart-hover-border: #a77;
        --color-shadow: rgba(255,255,255,0.1);
        --color-debug: #fa0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        padding: 20px;
        color: var(--color-white);
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: url('/images/background.jpg') center/cover no-repeat fixed;
        background-color: var(--color-black);
        transition: background-image 0.3s ease;
    }

    h1 { margin-bottom: 20px; text-align: center; }
    h3 { margin-bottom: 15px; color: var(--color-text-light); }

    .display-container {
        border: 4px solid var(--color-border-dark);
        border-radius: 8px;
        padding: 20px;
        background: var(--color-darker-bg);
        box-shadow: 0 0 20px var(--color-shadow);
    }

    #prototypeDisplay {
        border: 2px solid var(--color-border-medium);
        border-radius: 4px;
        background: var(--color-dark-bg);
        display: block;
        box-sizing: content-box;
        image-rendering: pixelated;
    }

    .game-controls {
        margin-top: 20px;
        text-align: center;
    }

    .action-buttons {
        margin-top: 20px;
    }

    .action-btn {
        background: var(--color-button-bg);
        color: var(--color-white);
        border: 2px solid var(--color-border-light);
        padding: 12px 24px;
        margin: 0 10px;
        border-radius: 8px;
        cursor: pointer;
        font-family: monospace;
        font-size: 14px;
        transition: all 0.1s;
    }

    .action-btn:hover {
        background: var(--color-button-hover);
        border-color: var(--color-border-lighter);
    }

    .action-btn.restart {
        background: var(--color-restart-bg);
        border-color: var(--color-restart-border);
    }

    .action-btn.restart:hover {
        background: var(--color-restart-hover);
        border-color: var(--color-restart-hover-border);
    }

    .status-display {
        margin-top: 15px;
        padding: 10px;
        background: var(--color-medium-bg);
        border-radius: 4px;
        font-size: 12px;
        color: var(--color-text-light);
        max-width: 600px;
    }
  </style>
</head>
<body>
  <h1>The Flipdot Arcade</h1>
  <h1>Press ENTER to select</h1>
  
  <div class="display-container">
    <canvas id="prototypeDisplay"></canvas>
  </div>
  
  <div class="game-controls">
    <h3>Game Controls</h3>
    <div class="action-buttons">
      <button class="action-btn" onclick="sendCommand('BACK')" style="background: #336; border-color: #558;">Back to Menu (ESC)</button>
      <button class="action-btn restart" onclick="sendCommand('RESTART')">Restart Game (R)</button>
    </div>
    
    <div class="status-display" id="gameStatus">Game Status: Loading...</div>
    
    <h3 style="margin-top: 30px; color: #fa0;">Debug Controls</h3>
    <div class="action-buttons">
      <button class="action-btn" onclick="sendCommand('NEXT_LEVEL')">Next Level (N)</button>
      <button class="action-btn" onclick="sendCommand('ADD_LIFE')" style="background: #363; border-color: #585;">Add Life (+)</button>
      <button class="action-btn" onclick="sendCommand('LOSE_LIFE')" style="background: #633; border-color: #855;">Lose Life (-)</button>
    </div>
  </div>
  <div style="height: 40px;">
    <div id="howtoPlay" style="margin-top: 20px; color: var(--color-text-light); font-size: 12px; text-align: center;">
      Use Arrow Keys or WASD to move the character. 
      <br>For full instructions, refer to the physical manual.
    </div>
  </div>
  
  <audio id="audio0" src="/audio/pacman_beginning.wav" preload="auto"></audio>
  <audio id="audio1" src="/audio/pacman_chomp.wav" preload="auto"></audio>
  <audio id="audio2" src="/audio/pacman_death.wav" preload="auto"></audio>
  <audio id="audio3" src="/audio/pacman_intermission.wav" preload="auto"></audio>
  <audio id="audio4" src="/audio/pacman_extrapac.wav" preload="auto"></audio>
  <audio id="audio5" src="/audio/pacman_tutorial.mp3" loop preload="auto"></audio>
  <audio id="audio6" src="/audio/gameplay.mp3" loop preload="auto"></audio>
  
  <script>
    const canvas = document.getElementById('prototypeDisplay');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('gameStatus');

    // ========== DOT RENDERING ==========
    // The server sends 1 bit per dot; we draw the dots here from two
    // pre-rendered sprites and only redraw dots that changed.
    const DOT_SIZE = 8;
    const DOT_SPACING = 2;
    const CELL = DOT_SIZE + DOT_SPACING;
    const DOT_COLORS = {
      on: { fill: '#f0f0f0', stroke: '#c0c0c0' },
      off: { fill: '#1a1a1a', stroke: '#0a0a0a' }
    };
    const BACKGROUND_COLOR = '#0a0a0a';
    const FRAME_HEADER_BYTES = 4;

    let gridWidth = 0;
    let gridHeight = 0;
    let dpr = 1;
    let sprites = null;
    let drawnBits = null;   // what is currently on the canvas
    let pendingBits = null; // latest frame from the server, not yet drawn
    let drawScheduled = false;

    function makeSprite({ fill, stroke }) {
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = Math.round(CELL * dpr);
      const sctx = sprite.getContext('2d');
      sctx.scale(dpr, dpr);
      sctx.fillStyle = BACKGROUND_COLOR;
      sctx.fillRect(0, 0, CELL, CELL);
      sctx.beginPath();
      sctx.arc(DOT_SIZE / 2 + 0.5, DOT_SIZE / 2 + 0.5, DOT_SIZE / 2, 0, Math.PI * 2);
      sctx.fillStyle = fill;
      sctx.fill();
      sctx.strokeStyle = stroke;
      sctx.lineWidth = 1;
      sctx.stroke();
      return sprite;
    }

    function setupGrid(width, height) {
      gridWidth = width;
      gridHeight = height;
      dpr = window.devicePixelRatio || 1;
      const cssWidth = width * CELL - DOT_SPACING + 1;
      const cssHeight = height * CELL - DOT_SPACING + 1;
      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';
      canvas.width = Math.round(cssWidth * dpr);
      canvas.height = Math.round(cssHeight * dpr);
      ctx.imageSmoothingEnabled = false;
      sprites = [makeSprite(DOT_COLORS.off), makeSprite(DOT_COLORS.on)];
      drawnBits = null; // force full redraw
    }

    function drawFrame() {
      drawScheduled = false;
      const bits = pendingBits;
      if (!bits || !sprites) return;

      const full = !drawnBits || drawnBits.length !== bits.length;
      const step = Math.round(CELL * dpr);
      for (let i = 0; i < gridWidth * gridHeight; i++) {
        const byte = i >> 3;
        const mask = 1 << (i & 7);
        const on = bits[byte] & mask;
        if (!full && (drawnBits[byte] & mask) === on) continue;
        const x = i % gridWidth;
        const y = (i / gridWidth) | 0;
        ctx.drawImage(sprites[on ? 1 : 0], x * step, y * step);
      }
      drawnBits = bits;
    }

    function handleFrame(buffer) {
      const view = new DataView(buffer);
      const width = view.getUint16(0, true);
      const height = view.getUint16(2, true);
      if (width !== gridWidth || height !== gridHeight) setupGrid(width, height);

      pendingBits = new Uint8Array(buffer, FRAME_HEADER_BYTES);
      if (!drawScheduled) {
        drawScheduled = true;
        requestAnimationFrame(drawFrame);
      }
    }

    // Redraw crisply when moving between screens with different pixel density
    matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener?.('change', () => {
      if (gridWidth) {
        setupGrid(gridWidth, gridHeight);
        if (!drawScheduled) { drawScheduled = true; requestAnimationFrame(drawFrame); }
      }
    });

    // ========== AUDIO ==========
    const audioElements = {
      'pacman_beginning.wav': document.getElementById('audio0'),
      'pacman_chomp.wav': document.getElementById('audio1'),
      'pacman_death.wav': document.getElementById('audio2'),
      'pacman_intermission.wav': document.getElementById('audio3'),
      'pacman_extrapac.wav': document.getElementById('audio4'),
      'pacman_tutorial.mp3': document.getElementById('audio5'),
      'gameplay.mp3': document.getElementById('audio6')
    };

    function playSound(soundName) {
      const audio = audioElements[soundName];
      if (!audio) return;

      // Don't restart background music if playing
      if (audio.loop && !audio.paused && audio.currentTime > 0) return;

      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function stopSound(soundName) {
      const audio = audioElements[soundName];
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    }

    // ========== CONNECTION ==========
    let socket = null;
    let reconnectDelay = 250;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        reconnectDelay = 250;
        drawnBits = null; // full redraw after (re)connect
      };

      socket.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          handleFrame(event.data);
          return;
        }
        const message = JSON.parse(event.data);
        if (message.type === 'status') {
          statusEl.textContent = message.status || 'Game Status: Running...';
        } else if (message.type === 'background') {
          if (message.background) {
            document.body.style.backgroundImage = `url('/images/${message.background}')`;
          }
        } else if (message.type === 'sound') {
          [].concat(message.stop || []).forEach(stopSound);
          if (message.sound) playSound(message.sound);
        }
      };

      socket.onclose = () => {
        statusEl.textContent = 'Game Status: Connection lost, reconnecting...';
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 4000);
      };
    }

    function sendCommand(command) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'command', command }));
        return;
      }
      fetch('/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command })
      }).catch(console.error);
    }

    // ========== KEYBOARD ==========
    const keyMap = {
      'arrowup': 'UP', 'w': 'UP',
      'arrowdown': 'DOWN', 's': 'DOWN',
      'arrowleft': 'LEFT', 'a': 'LEFT',
      'arrowright': 'RIGHT', 'd': 'RIGHT',
      'r': 'RESTART',
      'escape': 'BACK',
      'enter': 'START',
      'n': 'NEXT_LEVEL',
      '+': 'ADD_LIFE', '=': 'ADD_LIFE',
      '-': 'LOSE_LIFE', '_': 'LOSE_LIFE'
    };
    const REPEATABLE = new Set(['UP', 'DOWN', 'LEFT', 'RIGHT']);

    document.addEventListener('keydown', (e) => {
      const command = keyMap[e.key.toLowerCase()];
      if (!command) return;
      e.preventDefault();
      // Holding Enter/R/Esc shouldn't fire the action over and over
      if (e.repeat && !REPEATABLE.has(command)) return;
      sendCommand(command);
    });

    // ========== INIT ==========
    connect();

    document.addEventListener('DOMContentLoaded', () => {
      document.body.tabIndex = 0;
      document.body.focus();
    });
  </script>
</body>
</html>
